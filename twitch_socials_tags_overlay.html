<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twitch Redes Overlay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    :root {
      --accent: #f9a8d4;
      --accent-glow: rgba(249, 168, 212, 0.34);
      --accent-soft: rgba(249, 168, 212, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    /* Strictly transparent background by default for 1920x1080 OBS Browser Source */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      user-select: none;
    }

    /* Optional preview backdrops inside customizer (never affects OBS transparency) */
    body.preview-dark {
      background-color: #07090f;
      background-image:
        radial-gradient(circle at 20% 85%, var(--accent-soft), transparent 48%),
        radial-gradient(circle at 82% 18%, rgba(145, 70, 255, 0.08), transparent 45%);
    }

    body.preview-light {
      background-color: #e2e8f0;
      background-image:
        linear-gradient(to right, rgba(15, 23, 42, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 23, 42, 0.06) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Dark cyber-minimalist glassmorphism card */
    .socials-glass {
      position: relative;
      background: linear-gradient(150deg, rgba(11, 14, 24, 0.88), rgba(17, 22, 36, 0.78));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        0 20px 48px -12px rgba(0, 0, 0, 0.72),
        0 0 32px -10px var(--accent-glow),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.09);
      transition: box-shadow 0.4s ease, border-color 0.4s ease;
    }

    /* Corner placement utilities for 1920x1080 OBS browser source */
    .pos-bottom-left {
      bottom: 24px;
      left: 24px;
      top: auto;
      right: auto;
    }

    .pos-bottom-right {
      bottom: 24px;
      right: 24px;
      top: auto;
      left: auto;
    }

    .pos-top-left {
      top: 24px;
      left: 24px;
      bottom: auto;
      right: auto;
    }

    .pos-top-right {
      top: 24px;
      right: 24px;
      bottom: auto;
      left: auto;
    }

    /* Subtle scanline sheen */
    .glass-sheen {
      background: linear-gradient(
        115deg,
        transparent 25%,
        rgba(255, 255, 255, 0.03) 48%,
        transparent 72%
      );
      background-size: 220% 100%;
      animation: sheenSweep 9s linear infinite;
    }

    @keyframes sheenSweep {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }

    /* Custom scrollbar for customizer drawer */
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.4);
      border-radius: 999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <!-- ===================================================================== -->
  <!-- REDES OVERLAY MODULE (Transparent 1920x1080 OBS Overlay)             -->
  <!-- ===================================================================== -->
  <aside
    id="socials-widget"
    class="socials-glass glass-sheen pos-bottom-left fixed z-10 w-[440px] max-w-[calc(100vw-48px)] overflow-hidden rounded-2xl text-white"
    aria-label="Twitch Redes Overlay"
  >
    <!-- Top Accent Bar -->

      class="h-[2.5px] w-full"
      style="background: linear-gradient(90deg, var(--accent), rgba(255,255,255,0.28) 70%, transparent);"
    ></div>

    <div class="p-4">
      <!-- Compact Header (No counter badge) -->

            style="background-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow);"
          ></span>
          <span class="font-mono text-[10px] font-bold uppercase tracking-[0.18em] text-slate-300">
            REDES
          </span>
        </div>
      </div>

      <!-- Dynamic Social Items Container -->
      <div id="socials-list" class="grid grid-cols-1 gap-2 sm:grid-cols-2"></div>
    </div>
  </aside>

      <div class="flex items-center justify-between border-b border-white/10 pb-2.5">
        <div>
          <h2 class="text-xs font-bold uppercase tracking-wider text-white">
            Redes Setup
          </h2>
          <p class="font-mono text-[10px] text-slate-400">
            Atajos: [C] Panel • [H] Ocultar UI • ?clean=1
          </p>
        </div>
        <div class="flex items-center gap-1.5">
          <button
            id="hide-ui-btn"
            type="button"
            class="rounded-lg border border-white/10 bg-white/5 px-2 py-1 font-mono text-[10px] font-semibold text-slate-300 hover:bg-white/10 hover:text-white"
            title="Ocultar interfaz de configuración (Atajo: H)"
          >
            Hide UI
          </button>
          <button
            id="close-drawer-btn"
            type="button"
            class="rounded-lg border border-white/10 bg-white/5 px-2 py-1 font-mono text-xs text-slate-300 hover:bg-white/10 hover:text-white"
            title="Cerrar panel"
          >
            ✕
          </button>
        </div>
      </div>

      <!-- 1. Manage Social Items -->
      <div class="mt-3.5 space-y-2.5">
        <div class="flex items-center justify-between">
          <span class="font-mono text-[10px] font-bold uppercase tracking-wider text-slate-300">
            1. Redes
          </span>
          <button
            id="add-tag-btn"
            type="button"

          <div class="mt-1.5 grid grid-cols-2 gap-1.5">
            <button

            <button

            <button

            >
              ↖ Top Left
            </button>
            <button
              type="button"
              data-pos="pos-top-right"

          </div>
        </div>

        <div>

          <div class="mt-1.5 grid grid-cols-2 gap-1.5 rounded-xl border border-white/10 bg-slate-900 p-1">
            <button

              data-layout="grid"

        </div>

          <div class="mt-1.5 grid grid-cols-3 gap-1.5 rounded-xl border border-white/10 bg-slate-900 p-1">

              data-backdrop="transparent"
              class="backdrop-btn rounded-lg bg-pink-300/20 px-2 py-1 font-mono text-[10px] font-semibold text-pink-200"

              Transparente
            </button>
            <button

              data-backdrop="dark"
              class="backdrop-btn rounded-lg px-2 py-1 font-mono text-[10px] font-semibold text-slate-300 hover:bg-white/5"
            >
              Oscuro
            </button>
            <button
              type="button"
              data-backdrop="light"
              class="backdrop-btn rounded-lg px-2 py-1 font-mono text-[10px] font-semibold text-slate-300 hover:bg-white/5"
            >
              Claro
            </button>
          </div>
        </div>
      </div>
    </section>

      type="button"
      title="Configurar Redes Overlay (Atajo: C)"

      aria-controls="customizer-drawer"
    >

      ></span>
      <span>Redes Setup</span>
    </button>
  </div>

      function detectPlatform(item) {
        if (item && item.platform) {
          const explicit = PLATFORM_OPTIONS.find((p) => p.id === item.platform);
          if (explicit) return explicit;
        }
        const raw = `${(item && item.label) || ''} ${(item && item.handle) || ''}`.toLowerCase();
        if (raw.includes('twitch')) return PLATFORM_OPTIONS[0];
        if (raw.includes('tiktok')) return PLATFORM_OPTIONS[2];
        if (raw.includes('discord') || raw.includes('discord.gg')) return PLATFORM_OPTIONS[3];
        if (raw.includes('insta') || raw.includes('ig')) return PLATFORM_OPTIONS[4];
        if (raw.includes('youtu') || raw.includes('yt')) return PLATFORM_OPTIONS[5];
        if (raw.includes('kick')) return PLATFORM_OPTIONS[6];
        if (raw.includes('github')) return PLATFORM_OPTIONS[7];
        if (raw.includes('twitter') || raw.includes('x /') || raw === 'x') return PLATFORM_OPTIONS[1];
        return PLATFORM_OPTIONS[8];
      }

        { id: 'tag-twitch', platform: 'twitch', label: 'TWITCH', handle: '@tu_canal', enabled: true },
        { id: 'tag-x', platform: 'x', label: 'X / TW', handle: '@tu_handle', enabled: true },
        { id: 'tag-tiktok', platform: 'tiktok', label: 'TIKTOK', handle: '@tu_tiktok', enabled: true },
        { id: 'tag-discord', platform: 'discord', label: 'DISCORD', handle: 'discord.gg/tu-clan', enabled: true },
        { id: 'tag-instagram', platform: 'instagram', label: 'IG', handle: '@tu_ig', enabled: false },
        { id: 'tag-youtube', platform: 'youtube', label: 'YT', handle: '@tu_youtube', enabled: false },
      ];

      const STORAGE = {
        TAGS: 'tw_socials_tags_v1',
        POSITION: 'tw_socials_position_v1',
        LAYOUT: 'tw_socials_layout_v1',
        ACCENT: 'tw_socials_accent_v1',
        ACCENT_GLOW: 'tw_socials_accent_glow_v1',
        ACCENT_SOFT: 'tw_socials_accent_soft_v1',
      };

      function loadTags() {
        try {
          const raw = localStorage.getItem(STORAGE.TAGS);
          if (!raw) return DEFAULT_TAGS.map((t) => ({ ...t }));
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed) || parsed.length === 0) {
            return DEFAULT_TAGS.map((t) => ({ ...t }));
          }
          return parsed.map((item, idx) => {
            const detected = detectPlatform(item);
            return {
              id: String(item.id || `tag-${idx}-${Date.now()}`),
              platform: detected.id,
              label: String(item.label || detected.label),
              handle: String(item.handle || ''),
              enabled: item.enabled !== false,
            };
          });
        } catch (err) {
          console.error('Error loading redes from localStorage:', err);
          return DEFAULT_TAGS.map((t) => ({ ...t }));
        }
      }

      const state = {
        tags: loadTags(),
        position: localStorage.getItem(STORAGE.POSITION) || 'pos-bottom-left',
        layout: localStorage.getItem(STORAGE.LAYOUT) || 'grid',
      };

      // =========================================================================
      // DOM ELEMENTS
      // =========================================================================
      const widgetEl = document.getElementById('socials-widget');
      const socialsListEl = document.getElementById('socials-list');
      const tagEditorListEl = document.getElementById('tag-editor-list');
      const addTagBtn = document.getElementById('add-tag-btn');
      const accentPresetsGridEl = document.getElementById('accent-presets-grid');

      const customizerRootEl = document.getElementById('customizer-root');
      const drawerEl = document.getElementById('customizer-drawer');
      const toggleDrawerBtn = document.getElementById('toggle-drawer-btn');
      const closeDrawerBtn = document.getElementById('close-drawer-btn');
      const hideUiBtn = document.getElementById('hide-ui-btn');

      // =========================================================================
      // RENDERING REDES OVERLAY & EDITOR
      // =========================================================================
      function saveTags() {
        try {
          localStorage.setItem(STORAGE.TAGS, JSON.stringify(state.tags));
        } catch (err) {
          console.error('Error saving redes to localStorage:', err);
        }
      }

      function escapeHtml(text) {
        return String(text || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function renderOverlayTags() {
        const visibleTags = state.tags.filter((t) => t.enabled);

        if (state.layout === 'compact-row') {
          widgetEl.classList.remove('w-[440px]');
          widgetEl.classList.add('w-auto', 'max-w-[calc(100vw-48px)]');
          socialsListEl.className = 'flex flex-wrap items-center gap-2';
        } else {
          widgetEl.classList.remove('w-auto');
          widgetEl.classList.add('w-[440px]', 'max-w-[calc(100vw-48px)]');
          socialsListEl.className = 'grid grid-cols-1 gap-2 sm:grid-cols-2';
        }

        if (visibleTags.length === 0) {
          socialsListEl.innerHTML = `
            <div class="col-span-full rounded-xl border border-dashed border-white/15 bg-slate-950/45 px-3.5 py-2.5 text-center font-mono text-[11px] text-slate-400">
              Activa o añade redes en <span class="text-pink-200">Redes Setup</span>
            </div>
          `;
          return;
        }

        socialsListEl.innerHTML = visibleTags
          .map((item) => {
            const platform = detectPlatform(item);
            const handle = escapeHtml(item.handle || '@handle');
            const titleAttr = escapeHtml(platform.label);
            if (state.layout === 'compact-row') {
              return `
                <div class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-slate-950/65 px-3 py-1.5" title="${titleAttr}">
                  <span class="flex h-5 w-5 shrink-0 items-center justify-center" style="color: var(--accent);">${platform.svg}</span>
                  <span class="font-mono text-xs font-semibold text-slate-100">${handle}</span>
                </div>
              `;
            }
            return `
              <div class="flex items-center gap-2.5 rounded-xl border border-white/10 bg-slate-950/60 px-3 py-2" title="${titleAttr}">
                <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-lg bg-white/5" style="color: var(--accent);">${platform.svg}</span>
                <span class="min-w-0 flex-1 truncate font-mono text-xs font-semibold text-slate-100">${handle}</span>
              </div>
            `;
          })
          .join('');
      }

      function renderTagEditor() {
        tagEditorListEl.innerHTML = state.tags
          .map((item) => {
            const currentPlatform = detectPlatform(item);
            const optionsHtml = PLATFORM_OPTIONS.map(
              (opt) =>
                `<option value="${opt.id}" ${opt.id === currentPlatform.id ? 'selected' : ''}>${opt.label}</option>`
            ).join('');

            return `
              <div
                data-tag-id="${escapeHtml(item.id)}"
                class="rounded-xl border border-white/10 bg-slate-900/80 p-2 ${item.enabled ? '' : 'opacity-60'}"
              >
                <div class="flex items-center gap-1.5">
                  <input
                    type="checkbox"
                    ${item.enabled ? 'checked' : ''}
                    title="Mostrar / ocultar esta red"
                    class="tag-toggle-cb h-3.5 w-3.5 shrink-0 cursor-pointer accent-pink-300"
                  />
                  <span
                    class="flex h-6 w-6 shrink-0 items-center justify-center rounded-md bg-white/5"
                    style="color: var(--accent);"
                  >${currentPlatform.svg}</span>
                  <select
                    aria-label="Plataforma"
                    class="tag-platform-select w-[92px] shrink-0 rounded-lg border border-white/15 bg-slate-950 px-1.5 py-1 font-mono text-[10px] font-bold uppercase text-pink-200 outline-none focus:border-pink-300"
                  >
                    ${optionsHtml}
                  </select>
                  <input
                    type="text"
                    value="${escapeHtml(item.handle)}"
                    placeholder="@usuario o enlace"
                    class="tag-handle-input min-w-0 flex-1 rounded-lg border border-white/15 bg-slate-950 px-2 py-1 font-mono text-xs text-white outline-none focus:border-pink-300"
                  />
                  <button
                    type="button"
                    title="Eliminar red"
                    class="tag-delete-btn shrink-0 rounded-lg border border-white/10 bg-white/5 px-2 py-1 font-mono text-[10px] font-bold text-slate-400 transition hover:border-rose-400/40 hover:bg-rose-500/15 hover:text-rose-300"
                  >
                    ✕
                  </button>
                </div>
              </div>
            `;
          })
          .join('');

        // Bind per-row listeners
        tagEditorListEl.querySelectorAll('[data-tag-id]').forEach((row) => {
          const id = row.getAttribute('data-tag-id');
          const item = state.tags.find((t) => t.id === id);
          if (!item) return;

          const cb = row.querySelector('.tag-toggle-cb');
          const platformSelect = row.querySelector('.tag-platform-select');
          const handleInput = row.querySelector('.tag-handle-input');
          const deleteBtn = row.querySelector('.tag-delete-btn');

          cb.addEventListener('change', () => {
            item.enabled = cb.checked;
            row.classList.toggle('opacity-60', !item.enabled);
            saveTags();
            renderOverlayTags();
          });

          platformSelect.addEventListener('change', () => {
            const chosen =
              PLATFORM_OPTIONS.find((p) => p.id === platformSelect.value) || PLATFORM_OPTIONS[8];
            item.platform = chosen.id;
            item.label = chosen.label;
            saveTags();
            renderTagEditor();
            renderOverlayTags();
          });

          handleInput.addEventListener('input', () => {
            item.handle = handleInput.value;
            saveTags();
            renderOverlayTags();
          });

          deleteBtn.addEventListener('click', () => {
            state.tags = state.tags.filter((t) => t.id !== id);
            saveTags();
            renderTagEditor();
            renderOverlayTags();
          });
        });
      }

      addTagBtn.addEventListener('click', () => {
        const newItem = {
          id: `tag-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          platform: 'link',
          label: 'WEB',
          handle: '@nuevo_usuario',
          enabled: true,
        };
        state.tags.push(newItem);
        saveTags();
        renderTagEditor();
        renderOverlayTags();
      });

      // =========================================================================
      // POSITION, LAYOUT, ACCENT & CUSTOMIZER CONTROLS
      // =========================================================================
      function applyPosition(posClass) {
        const valid = ['pos-bottom-left', 'pos-bottom-right', 'pos-top-left', 'pos-top-right'];
        const chosen = valid.includes(posClass) ? posClass : 'pos-bottom-left';
        state.position = chosen;
        widgetEl.classList.remove(...valid);
        widgetEl.classList.add(chosen);
        localStorage.setItem(STORAGE.POSITION, chosen);

        document.querySelectorAll('.pos-btn').forEach((btn) => {
          const active = btn.getAttribute('data-pos') === chosen;
          btn.className = active
            ? 'pos-btn rounded-lg border border-pink-300/60 bg-pink-300/15 px-2.5 py-1.5 font-mono text-[10px] font-bold text-white'
            : 'pos-btn rounded-lg border border-white/10 bg-slate-900 px-2.5 py-1.5 font-mono text-[10px] font-semibold text-slate-300 hover:border-white/25';
        });
      }

      function applyLayout(layoutMode) {
        const chosen = layoutMode === 'compact-row' ? 'compact-row' : 'grid';
        state.layout = chosen;
        localStorage.setItem(STORAGE.LAYOUT, chosen);

        document.querySelectorAll('.layout-btn').forEach((btn) => {
          const active = btn.getAttribute('data-layout') === chosen;
          btn.className = active
            ? 'layout-btn rounded-lg bg-pink-300/20 px-2 py-1.5 font-mono text-[10px] font-bold text-pink-200'
            : 'layout-btn rounded-lg px-2 py-1.5 font-mono text-[10px] font-semibold text-slate-300 hover:bg-white/5';
        });

        renderOverlayTags();
      }

      function applyAccent(color, glow, soft) {
        const matched =
          ACCENT_PRESETS.find((p) => p.color.toLowerCase() === String(color || '').toLowerCase()) ||
          ACCENT_PRESETS[0];

        const nextColor = matched.color;
        const nextGlow = glow || matched.glow;
        const nextSoft = soft || matched.soft;

        document.documentElement.style.setProperty('--accent', nextColor);
        document.documentElement.style.setProperty('--accent-glow', nextGlow);
        document.documentElement.style.setProperty('--accent-soft', nextSoft);
        localStorage.setItem(STORAGE.ACCENT, nextColor);
        localStorage.setItem(STORAGE.ACCENT_GLOW, nextGlow);
        localStorage.setItem(STORAGE.ACCENT_SOFT, nextSoft);

        renderAccentPresets(nextColor);
        renderTagEditor();
      }

      function renderAccentPresets(activeColor) {
        if (!accentPresetsGridEl) return;
        const current = String(activeColor || ACCENT_PRESETS[0].color).toLowerCase();

        accentPresetsGridEl.innerHTML = ACCENT_PRESETS.map((preset) => {
          const isActive = preset.color.toLowerCase() === current;
          return `
            <button
              type="button"
              data-color="${preset.color}"
              data-glow="${preset.glow}"
              data-soft="${preset.soft}"
              title="${escapeHtml(preset.name)} (${preset.color})"
              class="color-btn flex items-center gap-1.5 rounded-lg border px-2 py-1.5 text-left font-mono text-[10px] transition ${
                isActive
                  ? 'border-white/60 bg-slate-800/95 font-bold text-white shadow-sm'
                  : 'border-white/10 bg-slate-900 font-semibold text-slate-300 hover:border-white/25 hover:text-white'
              }"
            >
              <span
                class="h-2.5 w-2.5 shrink-0 rounded-full"
                style="background-color: ${preset.color}; box-shadow: 0 0 8px ${preset.glow};"
              ></span>
              <span class="truncate">${escapeHtml(preset.name)}</span>
            </button>
          `;
        }).join('');

        accentPresetsGridEl.querySelectorAll('.color-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            applyAccent(
              btn.getAttribute('data-color'),
              btn.getAttribute('data-glow'),
              btn.getAttribute('data-soft')
            );
          });
        });
      }

      function toggleDrawer(force) {
        const shouldOpen = typeof force === 'boolean' ? force : drawerEl.classList.contains('hidden');
        drawerEl.classList.toggle('hidden', !shouldOpen);
        toggleDrawerBtn.setAttribute('aria-expanded', String(shouldOpen));
        toggleDrawerBtn.classList.toggle('opacity-100', shouldOpen);
      }

      document.querySelectorAll('.pos-btn').forEach((btn) => {
        btn.addEventListener('click', () => applyPosition(btn.getAttribute('data-pos')));
      });

      document.querySelectorAll('.layout-btn').forEach((btn) => {
        btn.addEventListener('click', () => applyLayout(btn.getAttribute('data-layout')));
      });

      document.querySelectorAll('.backdrop-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const mode = btn.getAttribute('data-backdrop');
          document.body.classList.remove('preview-dark', 'preview-light');
          if (mode === 'dark') document.body.classList.add('preview-dark');
          if (mode === 'light') document.body.classList.add('preview-light');

          document.querySelectorAll('.backdrop-btn').forEach((b) => {
            const active = b.getAttribute('data-backdrop') === mode;
            b.className = active
              ? 'backdrop-btn rounded-lg bg-pink-300/20 px-2 py-1 font-mono text-[10px] font-semibold text-pink-200'
              : 'backdrop-btn rounded-lg px-2 py-1 font-mono text-[10px] font-semibold text-slate-300 hover:bg-white/5';
          });
        });
      });

      toggleDrawerBtn.addEventListener('click', () => toggleDrawer());
      closeDrawerBtn.addEventListener('click', () => toggleDrawer(false));
      hideUiBtn.addEventListener('click', () => customizerRootEl.classList.add('hidden'));

      document.addEventListener('keydown', (e) => {
        const tag = (e.target && e.target.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        if (e.key.toLowerCase() === 'c') {
          customizerRootEl.classList.remove('hidden');
          toggleDrawer();
        } else if (e.key.toLowerCase() === 'h') {
          customizerRootEl.classList.toggle('hidden');
        }
      });

      // =========================================================================
      // INITIALIZATION
      // =========================================================================
      function init() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('clean') === '1') {
          customizerRootEl.classList.add('hidden');
        }

        const savedAccent = localStorage.getItem(STORAGE.ACCENT);
        const savedGlow = localStorage.getItem(STORAGE.ACCENT_GLOW);
        const savedSoft = localStorage.getItem(STORAGE.ACCENT_SOFT);
        if (savedAccent && savedGlow && savedSoft) {
          applyAccent(savedAccent, savedGlow, savedSoft);
        } else {
          applyAccent(ACCENT_PRESETS[0].color, ACCENT_PRESETS[0].glow, ACCENT_PRESETS[0].soft);
        }

        applyPosition(state.position);
        applyLayout(state.layout);
        renderTagEditor();
        renderOverlayTags();
      }

      init();
    })();
  </script>
</body>
</html>
